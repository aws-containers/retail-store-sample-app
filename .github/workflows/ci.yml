name: CI - Changed Services

on:
  pull_request:
    branches:
      - main
      - develop
      - ci/day-11-security-gates
  push:
    branches:
      - main
      - develop
      - ci/day-11-security-gates

permissions:
  contents: read

concurrency:
  group: day09-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      services: ${{ steps.changes.outputs.services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: print pipline information
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          echo 
          echo "Latest Commit:"
          git log -1 --oneline

      - name: Detect changed services
        id: changes
        env:
          event_name: ${{ github.event_name }}
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Base SHA: $base_sha"
          echo "Head SHA: $head_sha"
          echo "Event Name: $event_name"

          if [ "$event_name" == "pull_request" ]; then
            DIFF_BASE=$(git merge-base $base_sha $head_sha)
          else
            DIFF_BASE=$base_sha
          fi

          if [ -z "$DIFF_BASE" ] || [[ "$DIFF_BASE" =~ ^0+$ ]] ; then
            DIFF_BASE=$(git rev-parse "$head_sha^" 2>/dev/null || git rev-list --max-parents=0 "$head_sha")
          fi
          echo
          echo "comparing "
          echo "  base: $DIFF_BASE"
          echo "  head: $head_sha"
          changed_files=$(git diff --name-only $DIFF_BASE $head_sha)
          echo "Changed files:" 
          echo "$changed_files"
          services=()

          if echo "$changed_files" | grep -q "^.github/workflows/ci.yml$"; then 
            services=(
              "cart"
              "catalog"
              "checkout"
              "orders"
              "ui"
            )
          else
            for service in cart catalog checkout orders ui; do
              if echo "$changed_files" | grep -q "^src/${service}/"; then
                services+=("$service")
              fi
            done
          fi
          if [ ${#services[@]} -eq 0 ]; then
            echo "No services changed."
            MATRIX='[]'
            HAS_CHANGES=false
            SERVICE_LIST='none'
          else
            JSON_ITEMS=$(printf '"%s",' "${services[@]}")
            MATRIX="[${JSON_ITEMS%,}]"
            HAS_CHANGES=true
            SERVICE_LIST=$(IFS=,; echo "${services[*]}")
          fi
          echo
          echo "Matrix:"
          echo "$MATRIX"

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "services=$SERVICE_LIST" >> $GITHUB_OUTPUT

  service-ci:
    name: CI - ${{matrix.service}}
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{fromJSON(needs.detect.outputs.matrix)}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Show selected service
        run: |
          echo "================================"
          echo "Service: ${{ matrix.service }}"
          echo "================================"
      
      - name: Validate service directory
        run: |
          SERVICE_PATH="src/${{ matrix.service }}"
          echo "Checking....."
          echo "Service Path: $SERVICE_PATH"
          if [ ! -d "$SERVICE_PATH" ]; then
            echo "Error: Service directory '$SERVICE_PATH' does not exist."
            exit 1
          fi
          echo "Service directory exists: $SERVICE_PATH"
      
      - name: Validate Dockerfile 
        run: |
          Dockerfile_PATH="src/${{ matrix.service }}/Dockerfile"
          echo "Checking....."
          echo "Dockerfile Path: $Dockerfile_PATH"
          if [ ! -f "$Dockerfile_PATH" ]; then
            echo "Error: Dockerfile '$Dockerfile_PATH' does not exist."
            exit 1
          fi
          echo "Dockerfile exists: $Dockerfile_PATH"
      
      - name: set up java 21
        if: >
          matrix.service == 'cart' ||  matrix.service == 'orders' || matrix.service == 'ui'
        uses: actions/setup-java@v5
        with:
          cache: maven
          cache-dependency-path: src/${{ matrix.service }}/pom.xml
          java-version: 21
          distribution: temurin
      - name: validate cart service
        if: matrix.service == 'cart'
        working-directory: src/cart
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee "$RUNNER_TEMP/cart-test.log"
      - name: validate java service 
        if: matrix.service == 'orders' || matrix.service == 'ui'
        working-directory: src/${{ matrix.service }}
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee "$RUNNER_TEMP/${{ matrix.service }}-test.log"

      - name: setup node 20
        if: matrix.service == 'checkout' 
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/checkout/package-lock.json
      - name: validate checkout service
        if: matrix.service == 'checkout'
        working-directory: src/checkout
        run: |
          npm ci
          npm run lint --if-present
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/checkout-test.log"
          npm run build 
      - name: setup go 1.21
        if: matrix.service == 'catalog'
        uses: actions/setup-go@v7
        with:
          go-version-file: src/catalog/go.mod
          cache: true
          cache-dependency-path: src/catalog/go.sum
      - name: validate catalog service
        if: matrix.service == 'catalog'
        working-directory: src/catalog
        env:
          CGO_ENABLED: '1'
        run: |
          
          go vet ./...
          
          set -o pipefail
          go test -v ./... 2>&1 | tee "$RUNNER_TEMP/catalog-test.log"
          go build ./...
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.service }}-${{ github.run_id }}
          path: |
              ${{ runner.temp }}/${{ matrix.service }}-test.log
              src/${{ matrix.service }}/target/surefire-reports/**
              src/${{ matrix.service }}/target/failsafe-reports/**
              src/checkout/coverage/**
          if-no-files-found: warn
          retention-days: 7
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v4
      
      - name: prepare image metadata
        id: image_meta
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
      - name: build service image
        uses: docker/build-push-action@v7
        with:
          context: src/${{ matrix.service }}
          file: src/${{ matrix.service }}/Dockerfile
          push: false
          tags: retail-${{ matrix.service }}:sha-${{ steps.image_meta.outputs.short_sha }}
          load: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image_meta.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: verify service image
        run: |
          IMAGE=retail-${{ matrix.service }}:sha-${{ steps.image_meta.outputs.short_sha }}
          echo "Image: $IMAGE"
          docker image inspect "$IMAGE" 
          echo "Image $IMAGE built successfully."
          docker image inspect "$IMAGE" --format '{{json .Config.Labels}}' 
  no-service-changes:
    name: No application changes
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_changes == 'false'
    steps:
      - name: Skip application CI
        run: |
          echo "No application service changed."
          echo "Application build jobs are skipped."
      
  

  repository-security:
    name: Repository Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository for security scans
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
      
      - name: setup helm chart 
        uses: azure/setup-helm@v4
      
      - name: prepare helm dependency
        run: helm dependency update src/app/chart
      - name: scan dockerfile and iac
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: .
          format: sarif
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          limit-severities-for-sarif: true
      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-config-sarif-${{ github.run_id }}
          path: trivy-config.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: scan services dependencies
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: src/${{ matrix.service }}
          format: sarif
          output: "trivy-deps.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          limit-severities-for-sarif: true
      - name: scan built service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          scan-ref: retail-${{ matrix.service }}:sha-${{ needs.service-ci.outputs.image_meta.outputs.short_sha }}
          format: sarif
          output: "trivy-image-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          limit-severities-for-sarif: true
          skip-setup-trivy: true
      - name: Upload service security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.service }}-${{ github.run_id }}
          path: |
            trivy-fs-${{ matrix.service }}.sarif
            trivy-image-${{ matrix.service }}.sarif
          if-no-files-found: warn
          retention-days: 14
  
  security-gate:
    name: Release Security Gate
    needs: [service-ci, repository-security, no-service-changes]
    runs-on: ubuntu-latest  
    if: always()
    steps:
      - name: enforce release gate
        env:
          REPOSITORY_SECURITY: ${{ needs.repository-security.result }}
          SERVICE_CI: ${{ needs.service-ci.result }}
        run: |
          echo "Repository security: $REPOSITORY_SECURITY"
          echo "Service CI: $SERVICE_CI"
          if [ "$REPOSITORY_SECURITY" == "failure" ] ]; then
            echo "Release gate failed due to security issues or service CI failures."
            exit 1
          else
            echo "Release gate passed. No security issues or service CI failures detected."
          fi
          if [ "$SERVICE_CI" != "success" ] && [ "$SERVICE_CI" != "skipped" ]; then
            echo "Release block: service ci failed"
            exit1
          fi

          echo "Release gate passed. No security issues or service CI failures detected."
