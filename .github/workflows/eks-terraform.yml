name: Provision EKS Cluster (Terraform)

on:
  push:
    branches: [main]
    paths:
      - 'terraform/retail-store-eks/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      image_tag:
        description: 'Service image tag to deploy'
        required: false
        default: 'latest'

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_DIR:     terraform/retail-store-eks
  TF_VERSION: '1.9.0'

jobs:
  terraform:
    name: Terraform ${{ inputs.action || 'plan' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="image_tag=${{ inputs.image_tag || 'latest' }}" \
            -out=tfplan \
            -input=false
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Post plan summary
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Terraform Plan" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan 2>/dev/null | tail -30 >> $GITHUB_STEP_SUMMARY || true

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' || (github.ref == 'refs/heads/main' && github.event_name == 'push') }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy \
            -var="image_tag=${{ inputs.image_tag || 'latest' }}" \
            -auto-approve \
            -input=false
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Output cluster info
        if: ${{ inputs.action == 'apply' || (github.ref == 'refs/heads/main' && github.event_name == 'push') }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Cluster Outputs" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          terraform output -json 2>/dev/null \
            | jq -r 'to_entries[] | "| \(.key) | \(.value.value) |"' \
            >> $GITHUB_STEP_SUMMARY || true
