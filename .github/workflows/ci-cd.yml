name: CI/CD — End-to-End Deployment

# ─────────────────────────────────────────────────────────────────────────────
# Repo layout (single repo):
#   retail-store-sample-app/
#     src/                    ← application source + Dockerfiles
#     demo-eks-terraform/     ← EKS Terraform (copied from eks-course repo)
#
# Fully account-generic — zero hardcoded account IDs, bucket names, or role names.
# Everything is derived at runtime from the AWS credentials provided as inputs.
#
# Job order:
#   resolve-tag + bootstrap  (parallel)
#       └─► create-ecr       (AWS CLI — idempotent ECR repo creation)
#               ├─► build-services      (parallel — 5 app images)
#               └─► mirror-dependencies (parallel — 5 dependency images)
#                       └─► terraform  (EKS cluster + Helm/kubectl app deploy)
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:

      # ── AWS credentials ─────────────────────────────────────────────────────
      aws_access_key_id:
        description: 'AWS Access Key ID'
        required: true

      aws_secret_access_key:
        description: 'AWS Secret Access Key'
        required: true

      aws_region:
        description: 'AWS Region'
        required: false
        default: 'us-east-1'

      # ── OpenAI (optional) ────────────────────────────────────────────────────
      openai_api_key:
        description: 'OpenAI API Key (leave blank to disable AI chat in UI)'
        required: false
        default: ''

      # ── Pipeline options ─────────────────────────────────────────────────────
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

      image_tag:
        description: 'Docker image tag (leave blank → auto: sha-XXXXXXXX)'
        required: false
        default: ''

      skip_build:
        description: 'Skip building service images (re-use an already-pushed tag)'
        type: boolean
        required: false
        default: false

      skip_mirror:
        description: 'Skip mirroring third-party dependency images to ECR'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  TF_STATE_KEY: eks/terraform.tfstate
  TF_VERSION:   '1.10.0'   # 1.10+ supports native S3 locking — no DynamoDB needed
  TF_DIR:       demo-eks-terraform

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 1. Resolve image tag ──────────────────────────────────────────────────
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-8)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag → $TAG"

  # ── 2. Bootstrap: preflight checks + state backend ───────────────────────
  # - Derives ALL names from the live AWS account ID (no hardcoding).
  # - Auto-detects whether KodeKloud pre-created eksClusterRole so Terraform
  #   knows whether to create it or reuse it.
  bootstrap:
    name: Bootstrap & preflight
    runs-on: ubuntu-latest
    outputs:
      tf_state_bucket:    ${{ steps.derive.outputs.tf_state_bucket }}
      ecr_registry:       ${{ steps.derive.outputs.ecr_registry }}
      account_id:         ${{ steps.derive.outputs.account_id }}
      use_predefined_role: ${{ steps.derive.outputs.use_predefined_role }}
      cluster_name:       ${{ steps.derive.outputs.cluster_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Derive all names from live account
        id: derive
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ inputs.aws_region }}"

          # All names derived — nothing hardcoded
          TF_BUCKET="retail-store-tfstate-${ACCOUNT_ID}"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          CLUSTER_NAME="retail-store-eks"

          # Auto-detect if eksClusterRole already exists in this account.
          # In sandbox accounts (e.g. KodeKloud) the caller often lacks iam:GetRole,
          # so a 403 AccessDenied still means the role most likely exists — only a
          # true NoSuchEntity proves it's absent.
          ROLE_OUT=$(aws iam get-role --role-name eksClusterRole 2>&1) || true
          if echo "$ROLE_OUT" | grep -q '"RoleName"'; then
            USE_PREDEFINED="true"
            echo "eksClusterRole found — using predefined role"
          elif echo "$ROLE_OUT" | grep -qE 'NoSuchEntity|cannot be found'; then
            USE_PREDEFINED="false"
            echo "eksClusterRole not found — Terraform will create it"
          else
            USE_PREDEFINED="true"
            echo "get-role unreadable (likely AccessDenied) — assuming predefined role exists"
          fi

          echo "account_id=$ACCOUNT_ID"           >> "$GITHUB_OUTPUT"
          echo "tf_state_bucket=$TF_BUCKET"       >> "$GITHUB_OUTPUT"
          echo "ecr_registry=$ECR_REGISTRY"       >> "$GITHUB_OUTPUT"
          echo "cluster_name=$CLUSTER_NAME"       >> "$GITHUB_OUTPUT"
          echo "use_predefined_role=$USE_PREDEFINED" >> "$GITHUB_OUTPUT"

          echo "Account       : $ACCOUNT_ID"
          echo "State bucket  : $TF_BUCKET"
          echo "ECR registry  : $ECR_REGISTRY"
          echo "Cluster name  : $CLUSTER_NAME"
          echo "Predefined role: $USE_PREDEFINED"

      - name: Ensure S3 state bucket exists
        run: |
          BUCKET="${{ steps.derive.outputs.tf_state_bucket }}"
          REGION="${{ inputs.aws_region }}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists."
          else
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "Bucket created."
          fi

      # No DynamoDB needed — Terraform 1.10+ uses native S3 locking (use_lockfile=true)

  # ── 3. Create ECR repositories via AWS CLI ───────────────────────────────
  # Idempotent. ECR managed here (not in Terraform) so builds can push images
  # before the EKS cluster is created.
  create-ecr:
    name: Create ECR repositories
    runs-on: ubuntu-latest
    needs: [bootstrap]
    if: ${{ inputs.action != 'destroy' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Ensure all ECR repositories exist
        run: |
          REGION="${{ inputs.aws_region }}"
          REPOS=(
            retail-store-sample-ui
            retail-store-sample-catalog
            retail-store-sample-cart
            retail-store-sample-checkout
            retail-store-sample-orders
            retail-store-sample-mysql
            retail-store-sample-postgres
            retail-store-sample-rabbitmq
            retail-store-sample-dynamodb-local
            retail-store-sample-redis
          )
          for REPO in "${REPOS[@]}"; do
            if aws ecr describe-repositories --repository-names "$REPO" \
                 --region "$REGION" --no-cli-pager 2>/dev/null; then
              echo "$REPO — already exists"
            else
              aws ecr create-repository \
                --repository-name "$REPO" \
                --image-tag-mutability MUTABLE \
                --image-scanning-configuration scanOnPush=true \
                --region "$REGION" --no-cli-pager
              echo "$REPO — created"
            fi
          done

  # ── 4. Mirror third-party dependency images ───────────────────────────────
  mirror-dependencies:
    name: Mirror ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, create-ecr]
    if: ${{ inputs.skip_mirror != true && inputs.action != 'destroy' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mysql,          source: mysql:8.0,                     repo: retail-store-sample-mysql,          tag: "8.0"        }
          - { name: postgres,       source: postgres:16.1,                 repo: retail-store-sample-postgres,       tag: "16.1"       }
          - { name: rabbitmq,       source: rabbitmq:3-management,         repo: retail-store-sample-rabbitmq,       tag: 3-management }
          - { name: dynamodb-local, source: amazon/dynamodb-local:1.25.1,  repo: retail-store-sample-dynamodb-local, tag: "1.25.1"     }
          - { name: redis,          source: redis:6.0-alpine,              repo: retail-store-sample-redis,          tag: 6.0-alpine   }
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Login to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull, retag and push ${{ matrix.name }}
        run: |
          DEST="${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}"
          docker pull ${{ matrix.source }}
          docker tag  ${{ matrix.source }} "${DEST}:${{ matrix.tag }}"
          docker tag  ${{ matrix.source }} "${DEST}:latest"
          docker push "${DEST}:${{ matrix.tag }}"
          docker push "${DEST}:latest"

  # ── 5. Build and push application service images ──────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, create-ecr]
    if: ${{ inputs.skip_build != true && inputs.action != 'destroy' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ui,       context: src/ui,       repo: retail-store-sample-ui       }
          - { service: catalog,  context: src/catalog,  repo: retail-store-sample-catalog  }
          - { service: cart,     context: src/cart,     repo: retail-store-sample-cart     }
          - { service: checkout, context: src/checkout, repo: retail-store-sample-checkout }
          - { service: orders,   context: src/orders,   repo: retail-store-sample-orders   }
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Login to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.context }}
          push:       true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:${{ needs.resolve-tag.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:cache
          cache-to:   type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:cache,mode=max

  # ── 6. Terraform — EKS cluster + deploy app ──────────────────────────────
  # Uses demo-eks-terraform/ (committed in this repo) — no external repo clone needed.
  # Patches retail-store.yaml image URLs with private ECR before apply.
  # All Terraform vars are passed explicitly — no variable defaults relied upon.
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - bootstrap
      - create-ecr
      - build-services
      - mirror-dependencies
    if: |
      always() &&
      needs.bootstrap.result == 'success' &&
      (needs.create-ecr.result          == 'success' || needs.create-ecr.result          == 'skipped') &&
      (needs.build-services.result      == 'success' || needs.build-services.result      == 'skipped') &&
      (needs.mirror-dependencies.result == 'success' || needs.mirror-dependencies.result == 'skipped')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      # Replace all public ECR image URLs in retail-store.yaml with private ECR.
      # ECR registry and tag are derived at runtime — nothing hardcoded.
      - name: Patch retail-store.yaml with private ECR images
        run: |
          ECR="${{ needs.bootstrap.outputs.ecr_registry }}"
          TAG="${{ needs.resolve-tag.outputs.image_tag }}"
          YAML="${{ env.TF_DIR }}/retail-store.yaml"

          echo "ECR registry : $ECR"
          echo "Image tag    : $TAG"

          # Service images (built from source)
          sed -i "s|public.ecr.aws/aws-containers/retail-store-sample-ui:[^ \"]*|${ECR}/retail-store-sample-ui:${TAG}|g"           "$YAML"
          sed -i "s|public.ecr.aws/aws-containers/retail-store-sample-catalog:[^ \"]*|${ECR}/retail-store-sample-catalog:${TAG}|g"   "$YAML"
          sed -i "s|public.ecr.aws/aws-containers/retail-store-sample-cart:[^ \"]*|${ECR}/retail-store-sample-cart:${TAG}|g"         "$YAML"
          sed -i "s|public.ecr.aws/aws-containers/retail-store-sample-checkout:[^ \"]*|${ECR}/retail-store-sample-checkout:${TAG}|g" "$YAML"
          sed -i "s|public.ecr.aws/aws-containers/retail-store-sample-orders:[^ \"]*|${ECR}/retail-store-sample-orders:${TAG}|g"     "$YAML"

          # Dependency images (mirrored with fixed tags)
          sed -i "s|public.ecr.aws/docker/library/mysql:8.0|${ECR}/retail-store-sample-mysql:8.0|g"                                "$YAML"
          sed -i "s|public.ecr.aws/docker/library/postgres:16.1|${ECR}/retail-store-sample-postgres:16.1|g"                        "$YAML"
          sed -i "s|public.ecr.aws/docker/library/rabbitmq:3-management|${ECR}/retail-store-sample-rabbitmq:3-management|g"        "$YAML"
          sed -i "s|public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:1.25.1|${ECR}/retail-store-sample-dynamodb-local:1.25.1|g" "$YAML"
          sed -i "s|redis:6.0-alpine|${ECR}/retail-store-sample-redis:6.0-alpine|g"                                                "$YAML"

          echo "--- Patched image lines ---"
          grep "image:" "$YAML"

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.tf_state_bucket }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # All vars passed explicitly — no defaults relied on from variables.tf
      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="cluster_name=${{ needs.bootstrap.outputs.cluster_name }}" \
            -var="use_predefined_role=${{ needs.bootstrap.outputs.use_predefined_role }}" \
            -out=tfplan \
            -input=false

      - name: Plan summary
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Terraform Plan" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan 2>/dev/null | tail -40 >> $GITHUB_STEP_SUMMARY || true

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="cluster_name=${{ needs.bootstrap.outputs.cluster_name }}" \
            -var="use_predefined_role=${{ needs.bootstrap.outputs.use_predefined_role }}" \
            -auto-approve \
            -input=false

      - name: Update kubeconfig
        if: ${{ inputs.action == 'apply' }}
        run: |
          CLUSTER="${{ needs.bootstrap.outputs.cluster_name }}"
          aws eks update-kubeconfig --region "${{ inputs.aws_region }}" --name "$CLUSTER"

      - name: Wait for UI deployment
        if: ${{ inputs.action == 'apply' }}
        run: kubectl rollout status deployment/ui -n default --timeout=10m

      - name: Deployment summary
        if: ${{ inputs.action == 'apply' }}
        run: |
          CLUSTER="${{ needs.bootstrap.outputs.cluster_name }}"
          ALB=$(kubectl get ingress ui -n default \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")

          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| AWS Account  | ${{ needs.bootstrap.outputs.account_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag    | ${{ needs.resolve-tag.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECR Registry | ${{ needs.bootstrap.outputs.ecr_registry }} |" >> $GITHUB_STEP_SUMMARY
          echo "| EKS Cluster  | ${CLUSTER} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI URL       | http://${ALB} |" >> $GITHUB_STEP_SUMMARY
