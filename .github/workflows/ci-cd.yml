name: CI/CD — End-to-End Deployment

# ── Trigger: manual only ───────────────────────────────────────────────────────
# All credentials and options are supplied as inputs when you click
# "Run workflow" in the GitHub Actions UI — no secrets configuration needed.
on:
  workflow_dispatch:
    inputs:

      # ── AWS credentials ──────────────────────────────────────────────────────
      aws_access_key_id:
        description: 'AWS Access Key ID'
        required: true

      aws_secret_access_key:
        description: 'AWS Secret Access Key'
        required: true

      aws_region:
        description: 'AWS Region'
        required: false
        default: 'us-east-1'

      # ── OpenAI (optional — enables AI chat in the UI) ────────────────────────
      openai_api_key:
        description: 'OpenAI API Key (leave blank to disable AI chat in UI)'
        required: false
        default: ''

      # ── Pipeline options ─────────────────────────────────────────────────────
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

      image_tag:
        description: 'Docker image tag (leave blank → auto: sha-XXXXXXXX)'
        required: false
        default: ''

      skip_build:
        description: 'Skip building service images (re-use an already-pushed tag)'
        type: boolean
        required: false
        default: false

      skip_mirror:
        description: 'Skip mirroring third-party dependency images to ECR'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# ── Shared constants ───────────────────────────────────────────────────────────
env:
  DYNAMO_TABLE: retail-store-terraform-locks
  TF_STATE_KEY: retail-store-eks/terraform.tfstate
  TF_DIR:       terraform/retail-store-eks
  TF_VERSION:   '1.9.0'

# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 1. Resolve image tag ────────────────────────────────────────────────────
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-8)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag → $TAG"

  # ── 2. Bootstrap Terraform state backend ─────────────────────────────────────
  # Creates the S3 bucket + DynamoDB lock table if they do not exist yet.
  # Bucket name = retail-store-tfstate-<ACCOUNT_ID>  (unique per account).
  bootstrap:
    name: Bootstrap Terraform state
    runs-on: ubuntu-latest
    outputs:
      tf_state_bucket: ${{ steps.bucket.outputs.name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Derive bucket name from account ID
        id: bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="retail-store-tfstate-${ACCOUNT_ID}"
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "State bucket → $BUCKET"

      - name: Ensure S3 bucket exists
        run: |
          BUCKET="${{ steps.bucket.outputs.name }}"
          REGION="${{ inputs.aws_region }}"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket already exists."
          else
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "Bucket created."
          fi

      - name: Ensure DynamoDB lock table exists
        run: |
          TABLE="${{ env.DYNAMO_TABLE }}"
          REGION="${{ inputs.aws_region }}"

          STATUS=$(aws dynamodb describe-table \
            --table-name "$TABLE" --region "$REGION" \
            --query "Table.TableStatus" --output text 2>/dev/null || echo "MISSING")

          if [ "$STATUS" = "MISSING" ]; then
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION" \
              --tags Key=Project,Value=retail-store-sample-app Key=ManagedBy,Value=terraform
            aws dynamodb wait table-exists --table-name "$TABLE" --region "$REGION"
            echo "DynamoDB table created."
          else
            echo "DynamoDB table already exists."
          fi

      # ECR repos must exist before build/mirror jobs try to push images.
      # Terraform creates them later during apply, but we pre-create them here
      # so the parallel build jobs don't fail with "repository does not exist".
      - name: Ensure ECR repositories exist
        run: |
          REGION="${{ inputs.aws_region }}"
          REPOS=(
            retail-store-sample-ui
            retail-store-sample-catalog
            retail-store-sample-cart
            retail-store-sample-checkout
            retail-store-sample-orders
            retail-store-sample-mysql
            retail-store-sample-postgres
            retail-store-sample-rabbitmq
            retail-store-sample-dynamodb-local
            retail-store-sample-redis
          )
          for REPO in "${REPOS[@]}"; do
            if aws ecr describe-repositories --repository-names "$REPO" --region "$REGION" \
                 --no-cli-pager 2>/dev/null; then
              echo "$REPO — already exists"
            else
              aws ecr create-repository \
                --repository-name "$REPO" \
                --image-tag-mutability MUTABLE \
                --image-scanning-configuration scanOnPush=true \
                --region "$REGION" \
                --no-cli-pager
              echo "$REPO — created"
            fi
          done

  # ── 3. Mirror third-party dependency images ───────────────────────────────────
  mirror-dependencies:
    name: Mirror ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, bootstrap]
    if: ${{ inputs.skip_mirror != true && inputs.action != 'destroy' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mysql,          source: mysql:8.0,                      repo: retail-store-sample-mysql,         tag: "8.0"         }
          - { name: postgres,       source: postgres:16.1,                  repo: retail-store-sample-postgres,      tag: "16.1"        }
          - { name: rabbitmq,       source: rabbitmq:3-management,          repo: retail-store-sample-rabbitmq,      tag: 3-management  }
          - { name: dynamodb-local, source: amazon/dynamodb-local:1.25.1,   repo: retail-store-sample-dynamodb-local, tag: "1.25.1"    }
          - { name: redis,          source: redis:6.0-alpine,               repo: retail-store-sample-redis,         tag: 6.0-alpine   }
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Login to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull, retag and push ${{ matrix.name }}
        run: |
          DEST="${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}"
          docker pull ${{ matrix.source }}
          docker tag  ${{ matrix.source }} "${DEST}:${{ matrix.tag }}"
          docker tag  ${{ matrix.source }} "${DEST}:latest"
          docker push "${DEST}:${{ matrix.tag }}"
          docker push "${DEST}:latest"

  # ── 4. Build and push application service images ──────────────────────────────
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [resolve-tag, bootstrap]
    if: ${{ inputs.skip_build != true && inputs.action != 'destroy' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ui,       context: src/ui,       repo: retail-store-sample-ui       }
          - { service: catalog,  context: src/catalog,  repo: retail-store-sample-catalog  }
          - { service: cart,     context: src/cart,     repo: retail-store-sample-cart     }
          - { service: checkout, context: src/checkout, repo: retail-store-sample-checkout }
          - { service: orders,   context: src/orders,   repo: retail-store-sample-orders   }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Login to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.context }}
          push:       true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:${{ needs.resolve-tag.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:cache
          cache-to:   type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:cache,mode=max

  # ── 5. Terraform — provision infra and deploy via Helm ────────────────────────
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - bootstrap
      - build-services
      - mirror-dependencies
    if: |
      always() &&
      needs.bootstrap.result == 'success' &&
      (needs.build-services.result      == 'success' || needs.build-services.result      == 'skipped') &&
      (needs.mirror-dependencies.result == 'success' || needs.mirror-dependencies.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-region:            ${{ inputs.aws_region }}

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # ── init ────────────────────────────────────────────────────────────────
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.tf_state_bucket }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ env.DYNAMO_TABLE }}" \
            -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # ── plan ────────────────────────────────────────────────────────────────
      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="image_tag=${{ needs.resolve-tag.outputs.image_tag }}" \
            -var="openai_api_key=${{ inputs.openai_api_key }}" \
            -out=tfplan \
            -input=false

      - name: Plan summary
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Terraform Plan" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan 2>/dev/null | tail -40 >> $GITHUB_STEP_SUMMARY || true

      # ── apply ───────────────────────────────────────────────────────────────
      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      # ── destroy ─────────────────────────────────────────────────────────────
      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform destroy \
            -var="aws_region=${{ inputs.aws_region }}" \
            -var="image_tag=${{ needs.resolve-tag.outputs.image_tag }}" \
            -var="openai_api_key=${{ inputs.openai_api_key }}" \
            -auto-approve \
            -input=false

      # ── post-apply: kubeconfig + rollout wait + summary ─────────────────────
      - name: Update kubeconfig
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || echo "retail-store-eks")
          aws eks update-kubeconfig --region "${{ inputs.aws_region }}" --name "$CLUSTER"

      - name: Wait for UI rollout
        if: ${{ inputs.action == 'apply' }}
        run: kubectl rollout status deployment/ui -n default --timeout=10m

      - name: Deployment summary
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          ECR=$(terraform output -raw ecr_registry  2>/dev/null || echo "N/A")
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || echo "N/A")
          ALB=$(kubectl get ingress ui -n default \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          CHAT="${{ inputs.openai_api_key != '' && 'enabled (OpenAI)' || 'disabled' }}"

          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag    | ${{ needs.resolve-tag.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECR Registry | ${ECR} |" >> $GITHUB_STEP_SUMMARY
          echo "| EKS Cluster  | ${CLUSTER} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI URL       | http://${ALB} |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Chat      | ${CHAT} |" >> $GITHUB_STEP_SUMMARY
