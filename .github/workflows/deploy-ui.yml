name: Build and Deploy UI

on:
  push:
    branches:
      - main
      - feature/retail-app
    paths:
      - 'src/ui/**'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:
    inputs:
      claude_model:
        description: 'Claude model to use (e.g. claude-3-5-sonnet-20241022)'
        required: false
        default: 'claude-3-5-sonnet-20241022'
      environment:
        description: 'Target namespace in EKS'
        required: false
        default: 'default'

env:
  ECR_REPOSITORY: retail-store-ui
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region ${{ secrets.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name $ECR_REPOSITORY \
            --region ${{ secrets.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true

      - name: Build and push Docker image
        working-directory: src/ui
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          FULL_IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Building image: $FULL_IMAGE"
          docker build --tag "$FULL_IMAGE" --tag "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$FULL_IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: eks

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR again in deploy job so we can reconstruct the image URL
      # without relying on cross-job output passing (which can be empty)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig for EKS cluster
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy new image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NAMESPACE: ${{ inputs.environment || 'default' }}
        run: |
          FULL_IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Deploying image: $FULL_IMAGE"
          kubectl set image deployment/ui "ui=$FULL_IMAGE" -n "$NAMESPACE"

      - name: Configure Anthropic chat provider
        env:
          NAMESPACE: ${{ inputs.environment || 'default' }}
          CLAUDE_MODEL: ${{ inputs.claude_model || 'claude-3-5-sonnet-20241022' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          kubectl set env deployment/ui \
            -n "$NAMESPACE" \
            RETAIL_UI_CHAT_ENABLED=true \
            RETAIL_UI_CHAT_PROVIDER=anthropic \
            RETAIL_UI_CHAT_MODEL="$CLAUDE_MODEL" \
            RETAIL_UI_CHAT_ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"

          # Remove leftover OpenAI vars if they exist (ignore errors if already absent)
          kubectl set env deployment/ui -n "$NAMESPACE" \
            RETAIL_UI_CHAT_OPENAI_BASE_URL- \
            RETAIL_UI_CHAT_OPENAI_API_KEY- 2>/dev/null || true

      - name: Wait for rollout
        env:
          NAMESPACE: ${{ inputs.environment || 'default' }}
        run: |
          kubectl rollout status deployment/ui \
            -n "$NAMESPACE" \
            --timeout=5m

      - name: Print deployment summary
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          NAMESPACE: ${{ inputs.environment || 'default' }}
        run: |
          FULL_IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | $FULL_IMAGE |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | ${{ secrets.EKS_CLUSTER_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | $NAMESPACE |" >> $GITHUB_STEP_SUMMARY
          echo "| Model | ${{ inputs.claude_model || 'claude-3-5-sonnet-20241022' }} |" >> $GITHUB_STEP_SUMMARY
          kubectl get deployment ui -n "$NAMESPACE" \
            -o=jsonpath='| Pods | {.status.readyReplicas}/{.spec.replicas} |' \
            >> $GITHUB_STEP_SUMMARY
