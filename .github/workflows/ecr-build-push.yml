name: Build & Push to Private ECR

on:
  # Push trigger disabled — ci-cd.yml handles automated end-to-end runs.
  # This workflow is retained for targeted manual ECR builds only.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (leave blank to use git SHA)'
        required: false
        default: ''
      mirror_dependencies:
        description: 'Also mirror third-party dependency images'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ----------------------------------------------------------------
  # Build and push each application service image
  # ----------------------------------------------------------------
  build-service:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ui
            context: src/ui
            repo: retail-store-sample-ui
          - service: catalog
            context: src/catalog
            repo: retail-store-sample-catalog
          - service: cart
            context: src/cart
            repo: retail-store-sample-cart
          - service: checkout
            context: src/checkout
            repo: retail-store-sample-checkout
          - service: orders
            context: src/orders
            repo: retail-store-sample-orders

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:${{ steps.tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:cache
          cache-to:   type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}:cache,mode=max

  # ----------------------------------------------------------------
  # Mirror third-party dependency images to private ECR
  # Runs on every push to main, or when explicitly requested
  # ----------------------------------------------------------------
  mirror-dependencies:
    name: Mirror ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || inputs.mirror_dependencies == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysql
            source: mysql:8.0
            repo: retail-store-sample-mysql
            tag: "8.0"
          - name: postgres
            source: postgres:16.1
            repo: retail-store-sample-postgres
            tag: "16.1"
          - name: rabbitmq
            source: rabbitmq:3-management
            repo: retail-store-sample-rabbitmq
            tag: 3-management
          - name: dynamodb-local
            source: amazon/dynamodb-local:1.25.1
            repo: retail-store-sample-dynamodb-local
            tag: "1.25.1"
          - name: redis
            source: redis:6.0-alpine
            repo: retail-store-sample-redis
            tag: 6.0-alpine

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to private ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull, retag, and push ${{ matrix.name }}
        run: |
          DEST="${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}"
          docker pull ${{ matrix.source }}
          docker tag  ${{ matrix.source }} "${DEST}:${{ matrix.tag }}"
          docker tag  ${{ matrix.source }} "${DEST}:latest"
          docker push "${DEST}:${{ matrix.tag }}"
          docker push "${DEST}:latest"
