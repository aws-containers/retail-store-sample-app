name: Build And Push Images To ECR

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag. Defaults to <branch>-<short-sha>."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY_ID: "147723036683"
  ECR_REPO_CART: 147723036683.dkr.ecr.us-east-1.amazonaws.com/retail-carts
  ECR_REPO_CATALOG: 147723036683.dkr.ecr.us-east-1.amazonaws.com/retail-catalog
  ECR_REPO_CHECKOUT: 147723036683.dkr.ecr.us-east-1.amazonaws.com/retail-checkout
  ECR_REPO_ORDERS: 147723036683.dkr.ecr.us-east-1.amazonaws.com/retail-orders
  ECR_REPO_UI: 147723036683.dkr.ecr.us-east-1.amazonaws.com/retail-ui

concurrency:
  group: build-and-push-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve publish settings
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Resolve image tag
        id: resolve
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_IMAGE_TAG:-}" ]; then
            image_tag="$INPUT_IMAGE_TAG"
          else
            ref_slug="$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
            short_sha="${GITHUB_SHA::12}"
            image_tag="${ref_slug}-${short_sha}"
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker
        uses: ./.github/actions/setup-docker

      - name: Setup Env
        uses: ./.github/actions/setup-env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GithubActionsSession

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.ECR_REGISTRY_ID }}

      - name: Build images
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          TARGET_ARCH: ${{ matrix.arch }}
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail

          yarn nx container cart --tags ${ECR_REPO_CART}:${IMAGE_TAG}-${TARGET_ARCH}
          yarn nx container catalog --tags ${ECR_REPO_CATALOG}:${IMAGE_TAG}-${TARGET_ARCH}
          yarn nx container checkout --tags ${ECR_REPO_CHECKOUT}:${IMAGE_TAG}-${TARGET_ARCH}
          yarn nx container orders --tags ${ECR_REPO_ORDERS}:${IMAGE_TAG}-${TARGET_ARCH}
          yarn nx container ui --tags ${ECR_REPO_UI}:${IMAGE_TAG}-${TARGET_ARCH}

      - name: Push images
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          TARGET_ARCH: ${{ matrix.arch }}
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail

          yarn nx container cart --push true --tags ${ECR_REPO_CART}:${IMAGE_TAG}-${TARGET_ARCH}
          yarn nx container catalog --push true --tags ${ECR_REPO_CATALOG}:${IMAGE_TAG}-${TARGET_ARCH}
          yarn nx container checkout --push true --tags ${ECR_REPO_CHECKOUT}:${IMAGE_TAG}-${TARGET_ARCH}
          yarn nx container orders --push true --tags ${ECR_REPO_ORDERS}:${IMAGE_TAG}-${TARGET_ARCH}
          yarn nx container ui --push true --tags ${ECR_REPO_UI}:${IMAGE_TAG}-${TARGET_ARCH}

  publish:
    name: Publish multi-arch manifests
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup-env

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GithubActionsSession

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.ECR_REGISTRY_ID }}

      - name: Create multi-arch manifests
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail

          yarn nx manifest cart --args="--repository=${ECR_REPO_CART},--tag=${IMAGE_TAG}"
          yarn nx manifest catalog --args="--repository=${ECR_REPO_CATALOG},--tag=${IMAGE_TAG}"
          yarn nx manifest checkout --args="--repository=${ECR_REPO_CHECKOUT},--tag=${IMAGE_TAG}"
          yarn nx manifest orders --args="--repository=${ECR_REPO_ORDERS},--tag=${IMAGE_TAG}"
          yarn nx manifest ui --args="--repository=${ECR_REPO_UI},--tag=${IMAGE_TAG}"

      - name: Summarize published images
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          {
            echo "## Published images"
            echo
            echo "- ${ECR_REPO_CART}:${IMAGE_TAG}"
            echo "- ${ECR_REPO_CATALOG}:${IMAGE_TAG}"
            echo "- ${ECR_REPO_CHECKOUT}:${IMAGE_TAG}"
            echo "- ${ECR_REPO_ORDERS}:${IMAGE_TAG}"
            echo "- ${ECR_REPO_UI}:${IMAGE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
